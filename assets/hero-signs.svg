<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600">
  <rect width="480" height="600" fill="#16181f"/>
  <rect x="20" y="20" width="440" height="560" rx="18" fill="#232830"/>

  <!-- Warning -->
  <g transform="translate(50 48)">
    <polygon points="80,12 148,130 12,130" fill="#FFCC00" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <text x="80" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#111">!</text>
  </g>

  <!-- Prohibition -->
  <g transform="translate(270 48)">
    <circle cx="80" cy="71" r="68" fill="#fff" stroke="#E3000F" stroke-width="10"/>
    <line x1="32" y1="23" x2="128" y2="119" stroke="#E3000F" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Mandatory -->
  <g transform="translate(50 230)">
    <circle cx="80" cy="71" r="68" fill="#0052CC"/>
    <circle cx="80" cy="71" r="48" fill="#fff"/>
    <path d="M48 78 C48 58 62 46 80 46 C98 46 112 58 112 78 L112 92 L48 92 Z" fill="#0052CC"/>
    <rect x="58" y="88" width="44" height="10" rx="3" fill="#0052CC"/>
  </g>

  <!-- Fire -->
  <g transform="translate(270 230)">
    <rect x="8" y="8" width="144" height="144" rx="10" fill="#E3000F"/>
    <rect x="22" y="22" width="116" height="116" rx="6" fill="#fff"/>
    <path d="M80 38 C66 62 56 72 56 92 C56 110 66 122 80 122 C94 122 104 110 104 92 C104 72 94 62 80 38Z" fill="#E3000F"/>
    <rect x="72" y="108" width="16" height="14" fill="#E3000F"/>
  </g>

  <!-- Exit -->
  <g transform="translate(50 412)">
    <rect width="380" height="96" rx="10" fill="#00A651"/>
    <rect x="10" y="10" width="360" height="76" rx="6" fill="#fff"/>
    <path d="M52 72 L88 48 V62 H128 V78 H88 V84 Z" fill="#00A651"/>
    <text x="250" y="68" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#00A651">EXIT</text>
  </g>
</svg>
